spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:auction_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        id:
          db_structure_naming_strategy: single
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/auction_logs}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

aws:
  s3:
    endpoint: ${S3_ENDPOINT}
    bucket-name: ${S3_BUCKET_NAME}
    region: ${S3_REGION}
    access-key: ${S3_ACCESS_SECRET}
    secret-key: ${S3_REFRESH_SECRET}


app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  auth:
    reset-token-expiration-minutes: ${RESET_TOKEN_EXPIRATION_MINUTES:30}
  api:
    base-url: ${API_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000,http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  frontend-oauth2: ${FRONTEND_OAUTH2_REDIRECT_URL}


vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  url: ${VNPAY_PAY_URL}
  return-url: ${VNPAY_RETURN_URL}

security:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /api-docs

logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    root: INFO
    com.example.vehicle_auction: ${LOGGING_LEVEL_APP:INFO}
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE