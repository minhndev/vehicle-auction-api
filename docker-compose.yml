services:
  db-postgres:
    image: postgres:16-alpine
    container_name: auction-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TIME_ZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  db-mongodb:
    image: mongo:6.0
    container_name: auction-mongodb
    restart: always
    environment:
      TZ: ${TIME_ZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - mongo_data:/data/db
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  db-redis:
    image: redis:7-alpine
    container_name: auction-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      TZ: ${TIME_ZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - redis_data:/data
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  rabbitmq:
    build:
      context: ./rabbitmq
    container_name: auction-rabbitmq
    restart: always
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      TZ: ${TIME_ZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - frontend-network
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app-service:
    build: .
    container_name: auction-app
    restart: on-failure
    depends_on:
      - db-postgres
      - db-mongodb
      - db-redis
      - rabbitmq
      - minio
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-postgres:5432/${POSTGRES_DB}
      SPRING_DATA_MONGODB_URI: mongodb://db-mongodb:27017/${MONGO_DB:-auction_logs}
      SPRING_DATA_REDIS_HOST: db-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      S3_ENDPOINT: http://minio:9090
      TZ: ${TIME_ZONE:-Asia/Ho_Chi_Minh}
    networks:
      - frontend-network
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-03-20T23-11-32Z
    container_name: auction-minio
    restart: always
    ports:
      - "9090:9090"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_LICENSE: ${MINIO_LICENSE}
      TZ: ${TIME_ZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - minio_data:/data
    command: server /data --address ":9090" --console-address ":9001"
    networks:
      - frontend-network
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
  minio_data:
